# Render Blueprint for SIC Payment Agent
# Deploy: https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: sic-payment-agent-api
    runtime: node
    plan: starter
    buildCommand: |
      pnpm install
      pnpm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: NVIDIA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: APIMATIC_API_KEY
        sync: false
      - key: PAYPAL_MCP_URL
        value: https://mcp.paypal.com
      - key: CONFIDENCE_THRESHOLD
        value: "0.7"
      - key: DATABASE_URL
        fromDatabase:
          name: sic-payment-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sic-payment-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: sic-payment-agent-ui
    runtime: static
    plan: free
    buildCommand: |
      # No build needed - vanilla JS served directly
      echo "Static files ready"
    staticPublishPath: ./public
    envVars:
      - key: API_URL
        value: https://sic-payment-agent-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: sic-payment-db
    plan: starter
    databaseName: sic_payment_agent
    user: sic_payment_user
    # PostgreSQL 15+

services:
  # Redis for sessions/caching
  - type: redis
    name: sic-payment-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru